<title>Scenario Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Overpass:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: app bar with five views; overview = behavior cards; behavior = KPIs + scenario table + side panels; drawer for one scenario.
   Road-sign green accent, lane-marking amber for highlights, semantic pass/fail/excluded/deferred colors. */
:root{
  --bg:#F3F5F4; --surface:#FFFFFF; --surface-2:#F8FAF9; --ink:#0F1D17; --muted:#5A6B63; --line:#DCE3DF; --line-2:#EBF0ED;
  --accent:#0B6E4F; --accent-ink:#FFFFFF; --accent-soft:#E1F1EA; --amber:#D99A0B;
  --pass:#1F8A57; --pass-soft:#DDF2E6; --fail:#CF3F35; --fail-soft:#FBE3E0; --notrun:#9AA7A0; --notrun-soft:#ECEFED;
  --excl:#B7790A; --excl-soft:#FBEFD6; --defer:#4F69C6; --defer-soft:#E3E8FA;
  --s3:#B42318; --s2:#C76A0A; --s1:#5E7B1E;
  --asphalt:#39413E; --marking:#F4F4F0; --lane-yellow:#E8B417; --car:#5B8BD6; --car-line:#2C4F8C; --sdt:#ECEFEE; --sdt-line:#7B8A84; --obj:#E07B39; --emv:#C8423A; --road-label:#FFFFFF;
  --f-display:"Overpass","Arial Narrow",system-ui,sans-serif;
  --f-body:"Overpass",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:10px; --shadow:0 1px 2px rgba(15,29,23,.05),0 4px 16px rgba(15,29,23,.05);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1311; --surface:#151D1A; --surface-2:#1A2320; --ink:#E4EBE7; --muted:#97A69F; --line:#2A3632; --line-2:#212B28;
  --accent:#3DB57F; --accent-ink:#04120B; --accent-soft:#163328; --amber:#E8B23A;
  --pass:#4CC487; --pass-soft:#143323; --fail:#F0847A; --fail-soft:#3D1B18; --notrun:#7D8A84; --notrun-soft:#242E2B;
  --excl:#E3A93C; --excl-soft:#3A2C10; --defer:#8EA2EC; --defer-soft:#1C2445;
  --s3:#F0847A; --s2:#E8A35A; --s1:#A9C46A;
  --asphalt:#2A312E; --marking:#D9DCD8; --lane-yellow:#D9A514; --car:#6E98DC; --car-line:#A9C3EE; --sdt:#C9D0CC; --sdt-line:#8E9C95; --obj:#E58C4F; --emv:#E0665E; --road-label:#FFFFFF;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1311; --surface:#151D1A; --surface-2:#1A2320; --ink:#E4EBE7; --muted:#97A69F; --line:#2A3632; --line-2:#212B28;
  --accent:#3DB57F; --accent-ink:#04120B; --accent-soft:#163328; --amber:#E8B23A;
  --pass:#4CC487; --pass-soft:#143323; --fail:#F0847A; --fail-soft:#3D1B18; --notrun:#7D8A84; --notrun-soft:#242E2B;
  --excl:#E3A93C; --excl-soft:#3A2C10; --defer:#8EA2EC; --defer-soft:#1C2445;
  --s3:#F0847A; --s2:#E8A35A; --s1:#A9C46A;
  --asphalt:#2A312E; --marking:#D9DCD8; --lane-yellow:#D9A514; --car:#6E98DC; --car-line:#A9C3EE; --sdt:#C9D0CC; --sdt-line:#8E9C95; --obj:#E58C4F; --emv:#E0665E; --road-label:#FFFFFF;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45;padding-inline:16px;padding-block:0 40px}
h1,h2,h3,h4{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.005em}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-size:12px}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
.eyebrow{font-family:var(--f-display);font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.wrap{max-width:1440px;margin-inline:auto}

/* App bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);margin-inline:-16px;padding-inline:16px}
.bar-in{max-width:1440px;margin-inline:auto;display:flex;flex-wrap:wrap;align-items:center;gap:10px 22px;padding-block:12px}
.brand{display:flex;align-items:center;gap:10px}
.shield{width:34px;height:34px;border-radius:8px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:14px;box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--accent-ink) 35%,transparent)}
.brand h1{font-size:19px;font-weight:800}
.brand .sub{font-size:12px;color:var(--muted)}
.nav{display:flex;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px}
.nav button{border:0;background:none;padding:6px 14px;border-radius:999px;font-weight:700;font-size:13px;color:var(--muted);cursor:pointer}
.nav button[aria-current="true"]{background:var(--accent);color:var(--accent-ink)}
.nav button:hover:not([aria-current="true"]){color:var(--ink)}
.bar .right{margin-left:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.src{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 10px;font-size:12px;font-weight:700;border:1px solid var(--line);background:var(--surface)}
.src.demo{background:var(--excl-soft);border-color:var(--excl);color:var(--excl)}
.src .dot{width:8px;height:8px;border-radius:50%;background:currentColor}

/* Generic */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 12px;cursor:pointer;font-weight:700;font-size:13px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.small{padding:4px 9px;font-size:12px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.section{margin-top:22px}
.section-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 14px;margin-bottom:10px}
.section-head h2{font-size:17px;font-weight:800}
.section-head .hint{color:var(--muted);font-size:13px}
.chip{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:1px 8px;font-size:11.5px;font-weight:700;border:1px solid var(--line);background:var(--surface-2);white-space:nowrap}
.chip.code{font-family:var(--f-mono);font-weight:600;border-radius:5px}
.chip.ok{background:var(--pass-soft);border-color:transparent;color:var(--pass)}
.chip.ko{background:var(--fail-soft);border-color:transparent;color:var(--fail)}
.chip.ex{background:var(--excl-soft);border-color:transparent;color:var(--excl)}
.chip.df{background:var(--defer-soft);border-color:transparent;color:var(--defer)}
.chip.nr{background:var(--notrun-soft);border-color:transparent;color:var(--muted)}
.risk{display:inline-flex;border-radius:5px;overflow:hidden;font-family:var(--f-mono);font-size:11px;font-weight:600;border:1px solid var(--line);white-space:nowrap}
.risk span{padding:0 5px;background:var(--surface-2)}
.risk .s3{background:var(--s3);color:#fff}.risk .s2{background:var(--s2);color:#fff}.risk .s1{background:var(--s1);color:#fff}
.risk .s0{background:var(--notrun-soft)}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:13px}
th{font-family:var(--f-display);font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);background:var(--surface-2);white-space:nowrap;position:sticky;top:0}
td{padding:9px 10px;border-bottom:1px solid var(--line-2);vertical-align:top}
tr:last-child td{border-bottom:0}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--surface-2)}
tr.sel td{background:var(--accent-soft)}
td.num,th.num{text-align:right}
.empty{padding:28px;text-align:center;color:var(--muted)}
.note{font-size:12.5px;color:var(--muted)}

/* Stacked bar */
.sbar{display:flex;height:8px;border-radius:999px;overflow:hidden;background:var(--line-2);min-width:60px}
.sbar i{display:block;height:100%}
.sbar .p{background:var(--pass)}.sbar .f{background:var(--fail)}.sbar .n{background:var(--notrun)}.sbar .x{background:var(--excl)}.sbar .d{background:var(--defer)}
.sbar.big{height:12px}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}

/* KPIs */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kpi{padding:12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.kpi b{font-family:var(--f-display);font-size:24px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1}
.kpi span{font-size:12px;color:var(--muted)}
.kpi.pass b{color:var(--pass)}.kpi.fail b{color:var(--fail)}.kpi.excl b{color:var(--excl)}.kpi.defer b{color:var(--defer)}
.hero{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:14px;margin-top:18px}
@media (max-width:900px){.hero{grid-template-columns:minmax(0,1fr)}}
.hero .main{padding:18px 20px;display:flex;flex-direction:column;gap:12px}
.hero .main h2{font-size:22px;font-weight:800}
.bignum{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.bignum b{font-family:var(--f-display);font-size:40px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1}
.chain{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:12.5px;font-weight:700;color:var(--muted)}
.chain b{color:var(--ink)}
.chain i{font-style:normal;color:var(--accent)}

/* Behavior cards */
.uc-title{display:flex;align-items:center;gap:8px;margin:22px 0 10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.bcard{padding:14px 16px;display:flex;flex-direction:column;gap:10px;cursor:pointer;text-align:left;transition:border-color .15s,transform .15s}
.bcard:hover{border-color:var(--accent);transform:translateY(-1px)}
.bcard .top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.bcard h3{font-size:15px;font-weight:800}
.bcard .stats{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--muted)}
.bcard .rate{font-family:var(--f-display);font-size:22px;font-weight:800;font-variant-numeric:tabular-nums}
.bcard.ng{opacity:.75}
@media (prefers-reduced-motion:reduce){.bcard{transition:none}.bcard:hover{transform:none}}

/* Behavior view */
.bhead{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;margin-top:18px}
.bhead h2{font-size:24px;font-weight:800}
.bhead select,.tree-tools select{padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);font-weight:700;max-width:100%}
.def{margin-top:8px;font-size:13px;color:var(--muted);max-width:110ch}
.def summary{cursor:pointer;font-weight:700;color:var(--ink)}
.def pre{white-space:pre-wrap;font-family:var(--f-body);background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:10px;margin:8px 0 0}
.cols{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:14px;align-items:start}
@media (max-width:1100px){.cols{grid-template-columns:minmax(0,1fr)}}
.side{display:flex;flex-direction:column;gap:12px;min-width:0}
.panel{padding:14px 16px}
.panel h3{font-size:14px;font-weight:800;margin-bottom:10px}
.hbars{display:flex;flex-direction:column;gap:8px}
.hbar{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;font-size:12.5px}
.hbar .track{grid-column:1 / -1;height:6px;border-radius:999px;background:var(--line-2);overflow:hidden}
.hbar .track i{display:block;height:100%;background:var(--fail)}
.stitle{font-weight:700}
.sid{font-family:var(--f-mono);font-size:11.5px;color:var(--muted)}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
.filters input,.filters select{padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);min-width:0}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:5px 11px;font-size:12.5px;font-weight:700;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}

/* Drawer */
.scrim{position:fixed;inset:0;background:rgba(10,20,16,.35);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(980px,100%);background:var(--bg);z-index:41;display:flex;flex-direction:column;box-shadow:-10px 0 40px rgba(0,0,0,.18);padding-top:env(safe-area-inset-top,0px)}
.dhead{padding:16px 20px 0;background:var(--surface);border-bottom:1px solid var(--line)}
.dhead .row{display:flex;align-items:flex-start;gap:12px}
.dhead h2{font-size:20px;font-weight:800}
.dhead .x{margin-left:auto}
.tabs{display:flex;gap:2px;margin-top:12px;overflow-x:auto}
.tabs button{border:0;background:none;padding:9px 12px;font-weight:700;font-size:13px;color:var(--muted);border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.dbody{overflow:auto;padding:18px 20px 40px;flex:1;min-height:0}
.facts{display:grid;grid-template-columns:150px minmax(0,1fr);gap:8px 14px;margin:0;font-size:13px}
.facts dt{color:var(--muted);font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:.05em;padding-top:2px}
.facts dd{margin:0;min-width:0}
.scene-grid{display:grid;grid-template-columns:minmax(0,240px) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:700px){.scene-grid{grid-template-columns:minmax(0,1fr)}}
.scene{width:100%;height:auto;border-radius:8px;display:block;max-height:420px}
.fig figcaption{font-size:11.5px;color:var(--muted);margin-top:6px}
pre.code{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px;font-family:var(--f-mono);font-size:11.5px;line-height:1.5;overflow:auto;max-height:440px;margin:0;white-space:pre}
.con-grid{display:grid;grid-template-columns:minmax(0,220px) minmax(0,1fr);gap:14px;align-items:start;margin-top:12px}
@media (max-width:700px){.con-grid{grid-template-columns:minmax(0,1fr)}}

/* Tree */
.tree-tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:16px 0 10px}
.tree-wrap{overflow:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);max-height:calc(100vh - 210px);min-height:420px}
.tree-wrap svg{display:block}
.tnode{cursor:pointer}
.tnode rect.box{fill:var(--surface);stroke:var(--line);stroke-width:1}
.tnode:hover rect.box{stroke:var(--accent)}
.tnode text{font-family:var(--f-body);fill:var(--ink)}
.tnode .t1{font-size:12.5px;font-weight:700}
.tnode .t2{font-size:11px;fill:var(--muted)}
.tlink{fill:none;stroke:var(--line);stroke-width:1.5}

/* ODD */
.odd-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.oel{padding:12px 14px;display:flex;flex-direction:column;gap:6px;min-width:0}
.oel h4{font-size:14px;font-weight:800}
.dist{display:flex;align-items:flex-end;gap:2px;height:44px}
.dist i{flex:1;background:var(--accent);opacity:.75;border-radius:2px 2px 0 0;min-height:1px}
.heat td{text-align:center;font-variant-numeric:tabular-nums;font-size:12px;padding:7px 6px}
.heat th{text-align:center}
.heat td:first-child,.heat th:first-child{text-align:left}

/* Generate */
.dlist{display:flex;flex-direction:column;gap:10px;max-height:70vh;overflow:auto}
.dcard{padding:12px 14px;display:flex;flex-direction:column;gap:6px;box-shadow:none}
.dcard h4{font-size:14px;font-weight:800}
.dtop,.dmeta,.dbtn{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.dmeta{font-size:12px;color:var(--muted);gap:10px}
.dact{font-size:12px}
textarea#gText{width:100%;margin-top:6px;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2);resize:vertical;min-height:90px}
.nav{flex-wrap:wrap}

/* Data */
.drop{border:2px dashed var(--line);border-radius:var(--r);padding:22px;text-align:center;background:var(--surface)}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:8px;font-size:13px;z-index:60;max-width:90vw}
.progress{position:fixed;inset:0;display:grid;place-items:center;background:rgba(10,20,16,.3);z-index:70}
.progress .card{padding:18px 22px;min-width:280px}
.progress .sbar{margin-top:10px}
</style>

<div class="wrap">
<header class="bar"><div class="bar-in">
  <div class="brand"><div class="shield" aria-hidden="true">SS</div><div><h1>Scenario Studio</h1><div class="sub">Torc SDT · DO-Crawl I-35 South · milestone 1</div></div></div>
  <nav class="nav" aria-label="Views">
    <button type="button" data-view="overview">Overview</button>
    <button type="button" data-view="behavior">Behavior</button>
    <button type="button" data-view="generate">Generate</button>
    <button type="button" data-view="sotif">SOTIF analysis</button>
    <button type="button" data-view="tree">Tree</button>
    <button type="button" data-view="odd">ODD</button>
    <button type="button" data-view="data">Data</button>
  </nav>
  <div class="right"><span class="src" id="srcBadge"></span></div>
</div></header>
<main id="main"></main>
</div>
<div id="drawerRoot"></div>
<div class="toast" id="toast" role="status" hidden></div>
<div class="progress" id="progress" hidden><div class="card"><b id="progTxt">Computing…</b><div class="sbar big"><i class="p" id="progBar" style="width:0%"></i></div></div></div>
<input type="file" id="fileIn" accept=".csv,.json,.txt" hidden>
